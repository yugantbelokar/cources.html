<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .btn {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5a6fd8;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #6c757d;
        color: white;
      }

      .btn-secondary:hover {
        background: #5a6268;
      }

      .btn-success {
        background: #28a745;
        color: white;
      }

      .btn-success:hover {
        background: #218838;
      }

      .btn-danger {
        background: #dc3545;
        color: white;
      }

      .btn-danger:hover {
        background: #c82333;
      }

      .btn-warning {
        background: #ffc107;
        color: #212529;
      }

      .btn-warning:hover {
        background: #e0a800;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #e1e5e9;
      }

      th {
        background: #f8f9fa;
        font-weight: 600;
        color: #333;
      }

      tr:hover {
        background: #f8f9fa;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .search-box input {
        flex: 1;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 90%;
        max-width: 500px;
      }

      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
          margin-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Student Management System</h1>
      </div>

      <div id="alert" class="alert"></div>

      <div class="card">
        <h2>Student Information Form</h2>
        <form id="studentForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="id">Student ID *</label>
              <input type="text" id="id" required />
            </div>
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input type="text" id="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" required />
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" />
            </div>
            <div class="form-group">
              <label for="course">Course *</label>
              <select id="course" required>
                <option value="">Select Course</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Engineering">Engineering</option>
                <option value="Business">Business</option>
                <option value="Medicine">Medicine</option>
                <option value="Arts">Arts</option>
              </select>
            </div>
            <div class="form-group">
              <label for="grade">Grade</label>
              <select id="grade">
                <option value="">Select Grade</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" />
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              Add Student
            </button>
            <button type="button" class="btn btn-secondary" id="clearBtn">
              Clear Form
            </button>
            <button
              type="button"
              class="btn btn-warning"
              id="updateBtn"
              style="display: none"
            >
              Update Student
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              id="cancelBtn"
              style="display: none"
            >
              Cancel Edit
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="status-bar">
          <div>Total Students: <span id="totalStudents">0</span></div>
          <div>Last Updated: <span id="lastUpdated">-</span></div>
        </div>

        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search students by name, email, or course..."
          />
          <button class="btn btn-primary" id="searchBtn">Search</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <div class="table-container">
          <table id="studentsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Grade</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody">
              <!-- Students will be populated here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
      <div class="modal-content">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this student record?</p>
        <div class="actions">
          <button class="btn btn-danger" id="confirmDelete">Delete</button>
          <button class="btn btn-secondary" id="cancelDelete">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      class StudentManager {
        constructor() {
          this.students = this.loadStudents();
          this.editingId = null;
          this.init();
        }

        init() {
          this.bindEvents();
          this.renderTable();
          this.updateStats();
        }

        bindEvents() {
          // Form submission
          document
            .getElementById("studentForm")
            .addEventListener("submit", (e) => {
              e.preventDefault();
              this.handleSubmit();
            });

          // Buttons
          document
            .getElementById("clearBtn")
            .addEventListener("click", () => this.clearForm());
          document
            .getElementById("updateBtn")
            .addEventListener("click", () => this.updateStudent());
          document
            .getElementById("cancelBtn")
            .addEventListener("click", () => this.cancelEdit());
          document
            .getElementById("searchBtn")
            .addEventListener("click", () => this.searchStudents());
          document
            .getElementById("resetBtn")
            .addEventListener("click", () => this.resetSearch());
          document
            .getElementById("confirmDelete")
            .addEventListener("click", () => this.confirmDelete());
          document
            .getElementById("cancelDelete")
            .addEventListener("click", () => this.hideModal());

          // Real-time search
          document
            .getElementById("searchInput")
            .addEventListener("input", () => {
              this.searchStudents();
            });
        }

        loadStudents() {
          const stored = localStorage.getItem("students");
          return stored ? JSON.parse(stored) : [];
        }

        saveStudents() {
          localStorage.setItem("students", JSON.stringify(this.students));
          this.updateStats();
        }

        handleSubmit() {
          if (!this.validateForm()) return;

          const student = {
            id: document.getElementById("id").value,
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            course: document.getElementById("course").value,
            grade: document.getElementById("grade").value,
            address: document.getElementById("address").value,
            createdAt: new Date().toISOString(),
          };

          if (this.editingId) {
            this.updateStudent();
          } else {
            this.addStudent(student);
          }
        }

        addStudent(student) {
          // Check if ID already exists
          if (this.students.some((s) => s.id === student.id)) {
            this.showAlert("Student ID already exists!", "error");
            return;
          }

          this.students.push(student);
          this.saveStudents();
          this.renderTable();
          this.clearForm();
          this.showAlert("Student added successfully!", "success");
        }

        editStudent(id) {
          const student = this.students.find((s) => s.id === id);
          if (student) {
            document.getElementById("id").value = student.id;
            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("phone").value = student.phone;
            document.getElementById("course").value = student.course;
            document.getElementById("grade").value = student.grade;
            document.getElementById("address").value = student.address;

            this.editingId = id;
            this.toggleEditMode(true);
            this.showAlert("Now editing student: " + student.name, "success");
          }
        }

        updateStudent() {
          if (!this.validateForm()) return;

          const index = this.students.findIndex((s) => s.id === this.editingId);
          if (index !== -1) {
            this.students[index] = {
              ...this.students[index],
              name: document.getElementById("name").value,
              email: document.getElementById("email").value,
              phone: document.getElementById("phone").value,
              course: document.getElementById("course").value,
              grade: document.getElementById("grade").value,
              address: document.getElementById("address").value,
              updatedAt: new Date().toISOString(),
            };

            this.saveStudents();
            this.renderTable();
            this.cancelEdit();
            this.showAlert("Student updated successfully!", "success");
          }
        }

        deleteStudent(id) {
          this.studentToDelete = id;
          this.showModal();
        }

        confirmDelete() {
          if (this.studentToDelete) {
            this.students = this.students.filter(
              (s) => s.id !== this.studentToDelete
            );
            this.saveStudents();
            this.renderTable();
            this.hideModal();
            this.showAlert("Student deleted successfully!", "success");
          }
        }

        searchStudents() {
          const query = document
            .getElementById("searchInput")
            .value.toLowerCase();
          const filtered = this.students.filter(
            (student) =>
              student.name.toLowerCase().includes(query) ||
              student.email.toLowerCase().includes(query) ||
              student.course.toLowerCase().includes(query) ||
              student.id.toLowerCase().includes(query)
          );
          this.renderTable(filtered);
        }

        resetSearch() {
          document.getElementById("searchInput").value = "";
          this.renderTable();
        }

        renderTable(students = this.students) {
          const tbody = document.getElementById("studentsTableBody");

          if (students.length === 0) {
            tbody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                No students found. Add some students to get started!
                            </td>
                        </tr>
                    `;
            return;
          }

          tbody.innerHTML = students
            .map(
              (student) => `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td>${student.phone || "-"}</td>
                        <td>${student.course}</td>
                        <td>${student.grade || "-"}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="studentManager.editStudent('${
                              student.id
                            }')">
                                Edit
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="studentManager.deleteStudent('${
                              student.id
                            }')">
                                Delete
                            </button>
                        </td>
                    </tr>
                `
            )
            .join("");
        }

        validateForm() {
          const id = document.getElementById("id").value;
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const course = document.getElementById("course").value;

          if (!id || !name || !email || !course) {
            this.showAlert("Please fill in all required fields!", "error");
            return false;
          }

          if (!this.validateEmail(email)) {
            this.showAlert("Please enter a valid email address!", "error");
            return false;
          }

          return true;
        }

        validateEmail(email) {
          const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return re.test(email);
        }

        clearForm() {
          document.getElementById("studentForm").reset();
          this.cancelEdit();
        }

        cancelEdit() {
          this.editingId = null;
          this.toggleEditMode(false);
          this.clearForm();
        }

        toggleEditMode(editing) {
          document.getElementById("submitBtn").style.display = editing
            ? "none"
            : "inline-block";
          document.getElementById("updateBtn").style.display = editing
            ? "inline-block"
            : "none";
          document.getElementById("cancelBtn").style.display = editing
            ? "inline-block"
            : "none";
          document.getElementById("id").readOnly = editing;
        }

        updateStats() {
          document.getElementById("totalStudents").textContent =
            this.students.length;
          document.getElementById("lastUpdated").textContent =
            new Date().toLocaleString();
        }

        showAlert(message, type) {
          const alert = document.getElementById("alert");
          alert.textContent = message;
          alert.className = `alert alert-${type}`;
          alert.style.display = "block";

          setTimeout(() => {
            alert.style.display = "none";
          }, 3000);
        }

        showModal() {
          document.getElementById("deleteModal").style.display = "flex";
        }

        hideModal() {
          document.getElementById("deleteModal").style.display = "none";
          this.studentToDelete = null;
        }
      }

      // Initialize the application
      const studentManager = new StudentManager();

      // Add some sample data if empty
      if (studentManager.students.length === 0) {
        const sampleStudents = [
          {
            id: "S001",
            name: "John Doe",
            email: "john.doe@example.com",
            phone: "123-456-7890",
            course: "Computer Science",
            grade: "A",
            address: "123 Main St, City, State",
            createdAt: new Date().toISOString(),
          },
          {
            id: "S002",
            name: "Jane Smith",
            email: "jane.smith@example.com",
            phone: "098-765-4321",
            course: "Engineering",
            grade: "B",
            address: "456 Oak Ave, Town, State",
            createdAt: new Date().toISOString(),
          },
        ];

        studentManager.students = sampleStudents;
        studentManager.saveStudents();
        studentManager.renderTable();
      }
    </script>
  </body>
</html>
